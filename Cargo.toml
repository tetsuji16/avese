[package]
name = "avese"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
ab_glyph = "0.2.32"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.17", default-features = false }
serde_json = { version = "1", default-features = false, features = ["std"] }
tiny-skia = "0.12.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = 2
