[package]
name = "avese"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
ab_glyph = "0.2.32"
colorous = "1"
contour = "0.13"
delaunator = "1.1.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
egui-phosphor = { version = "0.14", default-features = false, features = ["regular"] }
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"] }
geo-types = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
tiny-skia = "0.12.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory"] }

[build-dependencies]
# MIT licensed; compiles the Windows VERSION/icon resource using the installed RC toolchain.
embed-resource = "3.0.12"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }

[profile.release]
opt-level = 2
